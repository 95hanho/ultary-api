spring:
  config:
    activate:
      on-profile: prod

  # ==============================
  # DB 설정 (MariaDB) - Prod
  # ==============================
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver

    # 운영 DB URL
    url: jdbc:mariadb://localhost:3306/DATABASE

    # DB 계정 (공유 금지 - 복사 후 채움 / 환경변수 권장)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    dbcp2:
      default-auto-commit: false

  # ==============================
  # 파일 업로드 경로 - Prod
  # ==============================
  servlet:
    multipart:
      location: ${UPLOAD_DIR:/path/to/ultary}
