# 운영 설정 템플릿 → ../application-prod.yml.

spring:
  config:
    activate:
      on-profile: prod

  # ==============================
  # DB 설정 (MariaDB) - Prod
  # ==============================
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver

    # 운영 DB URL
    url: ${DB_URL}

    # DB 계정 (공유 금지 - 복사 후 채움 / 환경변수 권장)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    dbcp2:
      default-auto-commit: false

  # ==============================
  # 파일 업로드 경로 - Prod
  # ==============================
  servlet:
    multipart:
      location: ${UPLOAD_DIR}
# BFF_INTERNAL_KEY는 FE .env.production과 동일한 값으로 설정한다.
# BFF server authentication (private configuration)
security:
  bff:
    shared-key: ${BFF_INTERNAL_KEY:}
    # Cafe24 terminates TLS before forwarding HTTP to Tomcat without a protocol header.
    # FE production requests still require HTTPS; the BFF key remains mandatory here.
    require-https: false
    # TLS를 종료하는 신뢰 프록시의 실제 peer IP/CIDR. 비우면 전달 헤더를 신뢰하지 않는다.
    trusted-proxies: ${BFF_TRUSTED_PROXIES:}

server:
  # 임의의 Forwarded 헤더로 request.isSecure()가 바뀌지 않도록 한다.
  forward-headers-strategy: none

# Browser WebSocket Origin must match the final FE domain.
ultary:
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:https://ultary-web.vercel.app}
