# 로컬 설정 템플릿 → ../application-local.yml.
spring:
  config:
    activate:
      on-profile: local
  # ==============================
  # DB 설정 (MariaDB + p6spy) - Local
  # ==============================
  datasource:
    # p6spy 사용 시 필수 드라이버
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

    # 로컬/개발 DB URL
    url: jdbc:p6spy:mariadb://HOST:3306/DATABASE

    # DB 계정 (공유 금지 - 복사 후 채움)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    dbcp2:
      default-auto-commit: false

  # ==============================
  # 파일 업로드 경로 - Local
  # ==============================
  servlet:
    multipart:
      location: ${UPLOAD_DIR:D:/files/ultary}

# BFF_INTERNAL_KEY는 FE .env.local과 동일한 값으로 설정한다.
# BFF server authentication (private configuration)
security:
  bff:
    shared-key: ${BFF_INTERNAL_KEY:}
    require-https: false
auth:
  phone:
    demo-mode: ${PHONE_AUTH_DEMO_MODE:true}
