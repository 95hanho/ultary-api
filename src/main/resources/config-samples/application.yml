spring:
  profiles:
    active: local
  application:
    name: ultary-api

  # ==============================
  # 개발 편의 설정
  # ==============================
  # DevTools: 터미널1 classes 감시 + 터미널2 bootRun
  # MyBatis XML은 classpath*: 로 잡아 재시작 시 mapper 로딩 실패를 줄인다
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

  freemarker:
    cache: false
  thymeleaf:
    cache: false

  # ==============================
  # Spring MVC 설정
  # ==============================
  mvc:
    hiddenmethod:
      filter:
        enabled: true
    problemdetails:
      # true면 Boot 기본 ProblemDetail 사용. 검증 오류는 GlobalExceptionHandler가 ApiResponse로 덮어씀.
      enabled: true

  # ==============================
  # 파일 업로드 설정 (공통)
  # - location 은 application-local / application-prod 에서 지정
  # ==============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# ==============================
# 서버 설정
# ==============================
server:
  port: 9377
  max-http-request-header-size: 400000

# ==============================
# MyBatis 설정
# ==============================
mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: me._hanho.ultary.domain
  configuration:
    jdbc-type-for-null: 'null'
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ==============================
# 로그 설정
# ==============================
logging:
  level:
    '[org.mybatis]': DEBUG
    '[org.apache.ibatis]': DEBUG
    '[java.sql]': DEBUG
    '[com.p6spy]': INFO
    # '[me._hanho.ultary.mapper]': DEBUG

# ==============================
# JWT 설정
# - secret 은 로컬 application.yml 에만 두거나 환경변수로 주입 (git 제외)
# - 이 파일은 설정 예시. 상위 디렉터리로 복사해 사용
# ==============================
jwt:
  secret:
    user: ${JWT_USER_SECRET}
    refresh: ${JWT_REFRESH_SECRET}
    admin: ${JWT_ADMIN_SECRET}
    phoneauth: ${JWT_PHONEAUTH_SECRET}
    phoneauth-complete: ${JWT_PHONEAUTH_COMPLETE_SECRET}
    pwdchange: ${JWT_PWDCHANGE_SECRET}

  # 만료 시간 (초)
  # - 재발급/만료 테스트 시 아래 TEST 주석을 사용
  expiration:
    access: 1800                 # 30분
    refresh: 1209600             # 14일
    phoneauth: 300               # 5분
    phoneauth-complete: 600      # 10분
    pwdchange: 600               # 10분
    # ---- TEST (만료/재발급 테스트용) ----
    # access: 10                 # 10초
    # refresh: 60                # 1분
    # phoneauth: 30              # 30초
    # phoneauth-complete: 60     # 1분
    # pwdchange: 60              # 1분
