spring:
  profiles:
    active: local
  application:
    name: ultary-api

  # ==============================
  # 개발 편의 설정
  # ==============================
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  freemarker:
    cache: false
  thymeleaf:
    cache: false

  # ==============================
  # Spring MVC 설정
  # ==============================
  mvc:
    hiddenmethod:
      filter:
        enabled: true
    problemdetails:
      enabled: true

  # ==============================
  # 파일 업로드 설정 (공통)
  # - location은 환경별(local/prod)로 분리
  # ==============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# ==============================
# 서버 설정
# ==============================
server:
  port: 9378
  max-http-request-header-size: 400000

# ==============================
# MyBatis 설정
# ==============================
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: me._hanho.ultary.domain
  configuration:
    jdbc-type-for-null: 'null'
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ==============================
# 로그 설정
# ==============================
logging:
  level:
    '[org.mybatis]': DEBUG
    '[org.apache.ibatis]': DEBUG
    '[java.sql]': DEBUG
    '[com.p6spy]': INFO
    #'[me._hanho.ultary-api.mapper]': DEBUG

# ==============================
# JWT 설정 (환경변수 사용)
# ==============================
jwt:
  secret:
    user: ${JWT_USER_SECRET}
    refresh: ${JWT_REFRESH_SECRET}
    admin: ${JWT_ADMIN_SECRET}
    phoneauth: ${JWT_PHONEAUTH_SECRET}
    phoneauth-complete: ${JWT_PHONEAUTH_COMPLETE_SECRET}
    pwdchange: ${JWT_PWDCHANGE_SECRET}

  # 만료 시간 (초 단위)
  # - 운영 기본값 사용
  # - 재발급/만료 테스트 시 아래 TEST 값으로 바꿔서 사용
  expiration:
    access: 1800                 # 30분
    refresh: 1209600             # 14일
    phoneauth: 300               # 5분
    phoneauth-complete: 600      # 10분
    pwdchange: 600               # 10분
    # ---- TEST (만료/재발급 테스트용) ----
    # access: 10                 # 10초
    # refresh: 60                # 1분
    # phoneauth: 30              # 30초
    # phoneauth-complete: 60     # 1분
    # pwdchange: 60              # 1분
